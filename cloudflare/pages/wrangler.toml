# nselive.pages.dev, the short address: a Pages project whose only job is to hand every request to the
# nse-live-chart Worker.   npx wrangler pages deploy   (from this folder)
name = "nselive"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

[[services]]
binding = "CHART"
service = "nse-live-chart"
