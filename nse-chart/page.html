<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSE Live Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script>try { const t = localStorage.getItem('nse-live-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
/* A trading terminal: toolbar and market strip on top, watchlist left, chart on the right. */
:root {
  --bg: #eef1f6;
  --panel: #ffffff;
  --raise: #f5f7fb;
  --ink: #131722;
  --muted: #6a6f7d;
  --line: #e0e3eb;
  --accent: #2962ff;      /* entry, focus, EMA 9 */
  --up: #089981;          /* buy, target, up candles */
  --down: #f23645;        /* sell, stop, down candles */
  --range: #e08a00;       /* opening range, EMA 21 */
  --up-soft: rgba(8, 153, 129, .12);
  --down-soft: rgba(242, 54, 69, .12);
  --sel: rgba(41, 98, 255, .10);
  --shadow: 0 1px 2px rgba(19, 23, 34, .06);
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f121a; --panel: #161a25; --raise: #1e2230; --ink: #d9dce3; --muted: #8b90a0; --line: #262b3a;
    --accent: #5b8cff; --up: #22ab94; --down: #f7525f; --range: #f5a524;
    --up-soft: rgba(34, 171, 148, .16); --down-soft: rgba(247, 82, 95, .16); --sel: rgba(91, 140, 255, .16);
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f121a; --panel: #161a25; --raise: #1e2230; --ink: #d9dce3; --muted: #8b90a0; --line: #262b3a;
  --accent: #5b8cff; --up: #22ab94; --down: #f7525f; --range: #f5a524;
  --up-soft: rgba(34, 171, 148, .16); --down-soft: rgba(247, 82, 95, .16); --sel: rgba(91, 140, 255, .16);
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 13px; line-height: 1.45; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up); } .down { color: var(--down); }

.app { height: 100vh; display: grid; gap: 1px; background: var(--line);
  grid-template-columns: 264px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "top top" "rail chart"; }

/* ---- toolbar ---- */
.top { grid-area: top; background: var(--panel); display: flex; align-items: center; flex-wrap: nowrap; gap: 8px 14px; padding: 8px 14px; min-height: 52px; }
.top { min-width: 0; }
.app > * { min-width: 0; }
.top > * { flex: none; }
.top > .spacer { flex: 1 1 0; min-width: 0; }
.top > .live { flex: 0 1 auto; min-width: 0; overflow: hidden; }
#liveTxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em; white-space: nowrap; }
.brand svg { color: var(--accent); }
.vr { width: 1px; align-self: stretch; background: var(--line); }
.symhead { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.symhead h1 { margin: 0; font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
.symhead .nm { color: var(--muted); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.last { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.last b { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 600; }
.last span { font-family: var(--f-mono); font-size: 0.8rem; }
.spacer { flex: 1; }
.seg { display: inline-flex; gap: 2px; padding: 2px; background: var(--raise); border-radius: 8px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.8rem; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.ibtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 500; white-space: nowrap; }
.ibtn:hover { background: var(--raise); }
.ibtn[aria-pressed="true"] { border-color: var(--up); color: var(--up); background: var(--up-soft); }
.ibtn svg { flex: none; }
a.ibtn { text-decoration: none; }
.signout:hover { border-color: var(--down); color: var(--down); background: var(--down-soft); }
.acct { position: relative; }
.acct summary { list-style: none; cursor: pointer; }
.acct summary::-webkit-details-marker { display: none; }
.acct .av { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; font: 700 0.8rem var(--f-body); text-transform: uppercase;
  color: #fff; background: linear-gradient(135deg, var(--up), var(--accent)); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--line); }
.acct summary:hover .av, .acct[open] .av { box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--accent); }
.acct-box { position: absolute; right: 0; top: 40px; z-index: 30; width: 240px; display: grid; gap: 8px; padding: 12px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.28); }
.acct-k { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.who { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-box .signout { justify-content: center; margin-top: 4px; }
[hidden] { display: none !important; }
.live { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live.open i { background: var(--up); box-shadow: 0 0 0 3px var(--up-soft); animation: pulse 2s infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .live.open i { animation: none; } }

/* ---- market strip ---- */

/* ---- watchlist ---- */
.rail { grid-area: rail; background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.rail-head { padding: 10px 10px 8px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.rail-head .t { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.search input { width: 100%; font: 0.82rem var(--f-body); padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raise); color: var(--ink); }
.filters { display: flex; gap: 2px; padding: 2px; background: var(--raise); border-radius: 8px; }
.filters button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 4px 0; border-radius: 6px; cursor: pointer; font-size: 0.74rem; font-weight: 500; }
.filters button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px; width: 100%; text-align: left; border: 0; border-left: 3px solid transparent; border-bottom: 1px solid var(--line); background: transparent; padding: 7px 10px 7px 9px; cursor: pointer; }
.row:hover { background: var(--raise); }
.row[aria-current="true"] { background: var(--sel); border-left-color: var(--accent); }
.row .sym { font-weight: 600; font-size: 0.84rem; display: flex; align-items: center; gap: 6px; min-width: 0; }
.row .px { font-family: var(--f-mono); font-size: 0.82rem; text-align: right; }
.row .st { font-size: 0.72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .chg { font-family: var(--f-mono); font-size: 0.74rem; text-align: right; }
.row.idx .sym { font-size: 0.9rem; }
.tag { font-size: 0.64rem; padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--muted); font-weight: 500; }
.surge { font-family: var(--f-mono); font-size: 0.66rem; padding: 0 5px; border-radius: 4px; font-weight: 700; color: #7a4a00; background: rgba(245,165,36,.22); }
:root[data-theme="dark"] .surge { color: var(--range); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .surge { color: var(--range); } }
.score { font-family: var(--f-mono); font-size: 0.68rem; padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--muted); font-weight: 600; }
.score.p { color: var(--up); background: var(--up-soft); } .score.m { color: var(--down); background: var(--down-soft); }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: var(--muted); }
.dot.target { background: var(--up); } .dot.stop { background: var(--down); } .dot.flat { background: var(--accent); }

/* ---- chart ---- */
.chartcol { grid-area: chart; background: var(--panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.ctools { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
.ctools .lbl { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); padding: 3px 9px; border-radius: 999px; cursor: pointer; font-size: 0.76rem; font-weight: 500; }
.chip i { width: 10px; height: 3px; border-radius: 2px; background: currentColor; opacity: .4; }
.chip[aria-pressed="true"] { color: var(--ink); border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.chip[aria-pressed="true"] i { opacity: 1; }
.pop { position: relative; }
.pop summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
.pop summary::-webkit-details-marker { display: none; }
.pop summary:hover { background: var(--raise); color: var(--ink); }
.pop .box { position: absolute; z-index: 10; top: 32px; left: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 8px 28px rgba(0,0,0,.18); display: grid; gap: 10px; width: 220px; }
.pop .box h4 { margin: 0; font-size: 0.82rem; }
.pop .seg { width: 100%; } .pop .seg button { flex: 1; padding: 4px 6px; }
.pop .hachk input { width: auto; }
.pop .poprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.pop label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.pop input { width: 72px; font: 0.8rem var(--f-mono); padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--raise); color: var(--ink); }
.pop input[readonly] { cursor: default; color: var(--muted); }
.pop .fine { margin: 0; }
.chartbox { position: relative; flex: 1; min-height: 360px; }
#chart { position: absolute; inset: 0; }
.legend { position: absolute; top: 4px; left: 6px; z-index: 3; pointer-events: none; display: grid; gap: 2px; font-size: 0.72rem; max-width: calc(100% - 96px); padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--panel) 70%, transparent); }
/* today's levels: a bar above the chart, so nothing sits on the candles */
.lvbar { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--raise); font-size: 0.74rem; min-height: 30px; }
.lvbar:empty { display: none; }
.lvbar .side { display: inline-flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.lvbar .k { color: var(--muted); } .lvbar .v { font-family: var(--f-mono); font-weight: 500; }
.lvbar .tag { font-weight: 700; font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; color: #fff; border: 0; cursor: pointer; font-family: var(--f-body); }
.lvbar .tag:hover { filter: brightness(1.1); box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px currentColor; }
/* ---- the desk: mood badge and day pill in the top bar, a panel from the right ---- */
.mood { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.mood i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.mood.trade i { background: var(--up); } .mood.small i { background: var(--range); } .mood.sit i { background: var(--down); }
.mood .pl { font-family: var(--f-mono); font-weight: 600; padding-left: 8px; margin-left: 2px; border-left: 1px solid var(--line); }
.desk { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: min(380px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -16px 0 40px rgba(0,0,0,.25);
  transform: translateX(105%); transition: transform .18s ease; display: flex; flex-direction: column; }
.desk.on { transform: none; }
@media (prefers-reduced-motion: reduce) { .desk { transition: none; } }
.desk header { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--line); font-weight: 700; }
.desk header button { border: 0; background: none; font-size: 1.3rem; line-height: 1; color: var(--muted); cursor: pointer; }
.desk .body { overflow-y: auto; padding: 4px 14px 24px; display: grid; gap: 14px; }
.desk h3 { margin: 10px 0 6px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.desk .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--raise); font-size: 0.8rem; }
.desk .moodbox b { font-size: 0.95rem; } .desk .moodbox ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); font-size: 0.76rem; line-height: 1.45; }
.desk .lockb { border-color: var(--down); background: var(--down-soft); color: var(--down); font-weight: 600; }
.desk .sides { display: flex; gap: 4px; margin-bottom: 8px; }
.desk .sides button { flex: 1; border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px; padding: 6px; font-weight: 700; cursor: pointer; }
.desk .sides button[aria-pressed="true"].buy { background: var(--up); border-color: var(--up); color: #fff; }
.desk .sides button[aria-pressed="true"].sell { background: var(--down); border-color: var(--down); color: #fff; }
.desk .kv { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 0.78rem; }
.desk .kv span:nth-child(odd) { color: var(--muted); } .desk .kv span:nth-child(even) { font-family: var(--f-mono); text-align: right; }
.desk .tgt { display: flex; gap: 4px; margin: 10px 0 8px; }
.desk .tgt button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 5px 4px; cursor: pointer; font-size: 0.72rem; color: var(--ink); }
.desk .tgt button b { display: block; font-family: var(--f-mono); font-size: 0.76rem; }
.desk .tgt button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.desk .go { width: 100%; border: 0; border-radius: 9px; padding: 10px; font-weight: 700; color: #fff; cursor: pointer; font-size: 0.86rem; }
.desk .go.buy { background: var(--up); } .desk .go.sell { background: var(--down); }
.desk .go[disabled] { background: var(--muted); opacity: .55; cursor: not-allowed; }
.desk .why { margin: 6px 0 0; font-size: 0.72rem; color: var(--muted); line-height: 1.4; }
.desk .err { color: var(--down); font-size: 0.76rem; margin: 6px 0 0; }
.desk .tr { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 0.76rem; }
.desk .tr:last-child { border-bottom: 0; }
.desk .tr .pnl { font-family: var(--f-mono); font-weight: 600; text-align: right; }
.desk .tr .sub { color: var(--muted); font-size: 0.7rem; }
.desk .tr button { justify-self: end; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 0.7rem; color: var(--ink); }
.desk form { display: grid; gap: 8px; }
.desk label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--muted); }
.desk label input[type=number] { width: 110px; font: 0.8rem var(--f-mono); padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }
.desk form button { justify-self: end; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 600; color: var(--ink); }
.lvbar .st { color: var(--muted); font-size: 0.7rem; }
/* the watchlist can be hidden: the chart takes the width */
.app.norail { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "chart"; }
.app.norail .rail { display: none; }
.legend .ln { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: baseline; }
.legend .ttl { font-weight: 600; color: var(--ink); font-size: 0.82rem; }
.legend .k { color: var(--muted); }
.legend .v { font-family: var(--f-mono); }
.chartmsg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); z-index: 4; background: var(--panel); }
.chartmsg.on { display: flex; }

.fine { color: var(--muted); font-size: 0.72rem; line-height: 1.5; }
.err { color: var(--down); }

/* ---- toasts ---- */
.toasts { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; display: grid; gap: 8px; max-width: min(340px, calc(100vw - 32px)); }
.toast { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 0.8rem; box-shadow: 0 8px 28px rgba(0,0,0,.22); }
.toast.buy { border-left-color: var(--up); } .toast.sell { border-left-color: var(--down); }
.toast b { font-family: var(--f-mono); }
.toast button { float: right; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem; line-height: 1; margin-left: 8px; }

/* ---- smaller screens ---- */
@media (max-width: 1500px) {
  .symhead .nm { display: none; }
  #railBtn span { display: none; }
}
@media (max-width: 1200px) {
  .app { grid-template-columns: 240px minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .top { flex-wrap: wrap; position: relative; padding-right: 58px; }
  .acct { position: absolute; top: 10px; right: 14px; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 100vh; grid-template-rows: auto 64vh 300px; grid-template-areas: "top" "chart" "rail"; }
  .app.norail { grid-template-rows: auto 80vh; grid-template-areas: "top" "chart"; }
  .chartbox { min-height: 300px; }
  .symhead .nm { display: none; }
  .legend .ln:nth-child(n+4) { display: none; }
  .vr { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V9M9 19V5M14 19v-7M19 19V8"/></svg>
      NSE Live
    </div>
    <button type="button" class="ibtn" id="railBtn" aria-pressed="true" title="Show or hide the watchlist">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      <span>Watchlist</span>
    </button>
    <span class="vr"></span>
    <div class="symhead"><h1 id="sym"></h1><span class="nm" id="nm"></span></div>
    <div class="last" id="last"></div>
    <div class="seg" id="tfSeg" role="group" aria-label="Timeframe">
      <button type="button" data-v="5m" aria-pressed="true">5m</button>
      <button type="button" data-v="15m" aria-pressed="false">15m</button>
      <button type="button" data-v="1h" aria-pressed="false">1H</button>
      <button type="button" data-v="1d" aria-pressed="false">1D</button>
    </div>
    <span class="spacer"></span>
    <span class="live" id="live"><i></i><span id="liveTxt">Connecting…</span></span>
    <button type="button" class="mood" id="moodBtn" title="Market mood and your paper desk"><i></i><span id="moodTxt">Desk</span><span class="pl" id="dayPl" hidden></span></button>
    <button type="button" class="ibtn" id="alertBtn" aria-pressed="false">

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
const IST = 19800, INDEX = 'NIFTY 50';
const state = { byTime: new Map(), seen: null, alertsOn: false, audio: null, sym: INDEX, tf: '5m', filter: 'all', q: '', data: null, board: [], indexPx: {}, fitted: null,
  ut: { on: true, key: 3, atr: 10, ha: true }, utSeen: null, show: { levels: true, vol: true }, vals: {} };
try { const s = localStorage.getItem('nse-live-sym'); if (s) state.sym = s; const f = localStorage.getItem('nse-live-tf'); if (f) state.tf = f;
  // nse-live-ut3: the default moved to Calm (key 3, Heikin Ashi): a quarter of key 2's signals flipped back within
  // 6 candles, 7 % of Calm's. Older saved settings start over on it.
  const u = JSON.parse(localStorage.getItem('nse-live-ut3') || 'null'); if (u) Object.assign(state.ut, { on: u.on !== false, key: +u.key || 3, atr: +u.atr || 10, ha: !!u.ha });
  const sh = JSON.parse(localStorage.getItem('nse-live-show') || 'null'); if (sh) Object.assign(state.show, sh); } catch (e) {}
{ const u = new URLSearchParams(location.search); if (u.get('sym')) state.sym = u.get('sym').toUpperCase(); if (['5m', '15m', '1h', '1d'].includes(u.get('tf'))) state.tf = u.get('tf'); }
const TF = {
  '5m': { show: 150, note: '60 sessions of 5-minute candles' },
  '15m': { show: 100, note: '60 sessions of 15-minute candles' },
  '1h': { show: 120, note: 'about a year of 1-hour candles' },
  '1d': { show: 130, note: 'two years of daily candles' },
};

function tickSize(p, isIndex) {
  if (isIndex) return 0.05;
  if (p < 250) return 0.01; if (p < 1000) return 0.05; if (p < 5000) return 0.10;
  if (p < 10000) return 0.50; if (p < 20000) return 1.00; return 5.00;
}
function toTick(p, mode, t) {
  const n = p / t;
  const k = mode === 'down' ? Math.floor(n + 1e-9) : mode === 'up' ? Math.ceil(n - 1e-9) : Math.floor(n + 0.5 + 1e-9);
  return +(k * t).toFixed(2);
}
const inr = (x) => '₹' + x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmt = (x) => x.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mins = (t) => { const d = new Date((t + IST) * 1000); return d.getUTCHours() * 60 + d.getUTCMinutes(); };
const clock = (m) => { const h = Math.floor(m / 60), mm = String(m % 60).padStart(2, '0'); return (h > 12 ? h - 12 : h) + ':' + mm + (h >= 12 ? ' PM' : ' AM'); };
const OPEN = 555, OR_END = 570, NO_AFTER = 870, FLAT = 910;
const cls = (score) => score >= 1 ? 'p' : score <= -1 ? 'm' : '';
const signed = (x, d) => (x >= 0 ? '+' : '') + x.toFixed(d);

// ---- the day's levels (same as orb_plan in live.py), closed 5-minute bars of one session ----
// BUY on a 5-minute close above the 9:15-9:30 high, SL the range low; SELL on a close below the low, SL the high.
// T1, T2, T3 = 1, 2, 3 range widths past the entry. Entries until 2:30 PM, out by 15:10.
function rangeLevels(hi, lo, isIndex) {
  const t = tickSize(hi, isIndex), w = +(hi - lo).toFixed(2);
  const out = { status: w < 5 * t - 1e-9 ? 'refused' : 'ready', orH: hi, orL: lo, w, t };
  for (const [side, entry, stop, k] of [['buy', hi, lo, 1], ['sell', lo, hi, -1]])
    out[side] = { side, entry, stop, targets: [1, 2, 3].map(n => toTick(+(entry + k * n * w).toFixed(2), 'nearest', t)), status: 'waiting', hits: [], exit: null };
  return out;
}
function dayLevels(bars, isIndex) {
  const rng = bars.filter(b => mins(b[0]) >= OPEN && mins(b[0]) < OR_END);
  if (rng.length < 3) return { status: 'forming' };
  const out = rangeLevels(Math.max(...rng.map(b => b[2])), Math.min(...rng.map(b => b[3])), isIndex);
  if (out.status !== 'ready') return out;
  const late = mins(bars[bars.length - 1][0]) + 5 >= NO_AFTER;
  for (const s of [out.buy, out.sell]) {
    const k = s.side === 'buy' ? 1 : -1;
    s.status = late ? 'none' : 'waiting';
    let idx = -1;
    for (let i = 0; i < bars.length; i++) {
      const m = mins(bars[i][0]);
      if (m < OR_END) continue;
      if (m + 5 > NO_AFTER) break;
      if (k > 0 ? bars[i][4] > out.orH : bars[i][4] < out.orL) { idx = i; break; }
    }
    if (idx < 0) continue;
    Object.assign(s, { status: 'trig', idx, etime: mins(bars[idx][0]) + 5, fill: bars[idx][4] });
    for (let i = idx + 1; i < bars.length; i++) {
      const [ts, o, h, l] = bars[i], m = mins(ts);
      if (m >= FLAT) { s.exit = { i, px: o, m, how: 'flat' }; break; }
      if (k > 0 ? l <= s.stop : h >= s.stop) { s.exit = { i, px: k > 0 ? Math.min(s.stop, o) : Math.max(s.stop, o), m: m + 5, how: 'stop' }; break; }
      while (s.hits.length < 3 && (k > 0 ? h >= s.targets[s.hits.length] : l <= s.targets[s.hits.length])) s.hits.push({ i, m: m + 5 });
      if (s.hits.length === 3) { s.exit = { i, px: s.targets[2], m: m + 5, how: 't3' }; break; }
    }
  }
  return out;
}

// UT Bot Alerts (the TradingView script, same maths as ut_bot in live.py): an ATR trailing stop
// key × ATR from the close; Buy when the close crosses above it, Sell when it crosses below.
// heikin: follow the Heikin Ashi close (o+h+l+c)/4, the script's option; the ATR stays on the real bars
function utBot(bars, key, period, heikin) {
  const stops = new Array(bars.length).fill(null), sig = [], src = bars.map(b => heikin ? (b[1] + b[2] + b[3] + b[4]) / 4 : b[4]);
  let atr = 0, prev = null;
  for (let i = 0; i < bars.length; i++) {
    const b = bars[i];
    const tr = i ? Math.max(b[2] - b[3], Math.abs(b[2] - bars[i - 1][4]), Math.abs(b[3] - bars[i - 1][4])) : b[2] - b[3];
    if (i < period - 1) { atr += tr; continue; }
    atr = i === period - 1 ? (atr + tr) / period : (atr * (period - 1) + tr) / period;
    const c = src[i], loss = key * atr, ps = prev === null ? 0 : prev, pc = i ? src[i - 1] : c;
    const s = c > ps && pc > ps ? Math.max(ps, c - loss) : c < ps && pc < ps ? Math.min(ps, c + loss) : c > ps ? c - loss : c + loss;
    if (prev !== null) {
      if (c > s && pc <= prev) sig.push([i, 'buy']);
      else if (c < s && pc >= prev) sig.push([i, 'sell']);
    }
    stops[i] = prev = s;
  }
  return { stops, sig, src };
}
// the candle that holds a 5-minute bar, on a longer timeframe
function bucket(cs, ts) { let lo = 0, hi = cs.length - 1, ans = null; while (lo <= hi) { const m = (lo + hi) >> 1; if (cs[m][0] <= ts) { ans = cs[m][0]; lo = m + 1; } else hi = m - 1; } return ans; }

// ---- chart ----
const el = document.getElementById('chart');
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
let chart, candles, ut, lines = [];
function themeChart() {
  if (!chart) return;
  chart.applyOptions({
    layout: { background: { type: 'solid', color: css('--panel') }, textColor: css('--muted'), fontFamily: 'IBM Plex Mono, monospace', fontSize: 11 },
    grid: { vertLines: { color: css('--line') + '80' }, horzLines: { color: css('--line') + '80' } },
    rightPriceScale: { borderColor: css('--line') }, timeScale: { borderColor: css('--line') },
    crosshair: { vertLine: { labelBackgroundColor: css('--ink') }, horzLine: { labelBackgroundColor: css('--ink') } },
  });
  candles.applyOptions({ upColor: css('--up'), downColor: css('--down'), borderUpColor: css('--up'), borderDownColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down') });
  if (state.data) renderChart();
}
function initChart() {
  if (!window.LightweightCharts) { chartMsg('The chart library did not load. It needs an internet connection.'); return; }
  chart = LightweightCharts.createChart(el, { autoSize: true, timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6 }, crosshair: { mode: 0 } });
  candles = chart.addCandlestickSeries({ priceLineVisible: true, priceLineWidth: 1, priceLineStyle: 2 });
  ut = chart.addLineSeries({ lineWidth: 2, lineStyle: 1, priceLineVisible: false, lastValueVisible: true, crosshairMarkerVisible: false, title: 'UT' });
  candles.attachPrimitive(levelLines);
  candles.attachPrimitive(utLabels);
  chart.subscribeCrosshairMove((param) => showLegend(param && param.time ? param.time : null));
  candles.priceScale().applyOptions({ scaleMargins: { top: 0.12, bottom: 0.08 } });
  themeChart();
}
// UT Bot Buy / Sell as filled labels like TradingView's, drawn on the chart's own canvas (a series primitive),
// so they stay on their candle while you scroll and zoom
class SignalLabels {
  constructor() { this.items = []; const self = this; this.view = { zOrder: () => 'top', renderer: () => ({ draw: (t) => self.draw(t) }) }; }
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }
  detached() { this.chart = null; }
  updateAllViews() {}
  paneViews() { return [this.view]; }
  set(items) { this.items = items; if (this.req) this.req(); }
  draw(target) {
    if (!this.chart || !this.items.length) return;
    const ts = this.chart.timeScale();
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
      ctx.save();
      ctx.font = '700 12px "IBM Plex Sans", "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const it of this.items) {
        const x = ts.timeToCoordinate(it.time), y = this.series.priceToCoordinate(it.price);
        if (x === null || y === null || x < -40 || x > mediaSize.width + 40) continue;
        const buy = it.kind === 'buy', text = buy ? 'Buy' : 'Sell', w = ctx.measureText(text).width + 16, hgt = 20;
        ctx.fillStyle = it.color;
        const tip = buy ? y + 5 : y - 5, top = buy ? tip + 6 : tip - 6 - hgt, base = buy ? tip + 6 : tip - 6;
        ctx.beginPath(); ctx.moveTo(x, tip); ctx.lineTo(x - 5, base); ctx.lineTo(x + 5, base); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x - w / 2, top, w, hgt, 4); else ctx.rect(x - w / 2, top, w, hgt);
        ctx.fill();
        ctx.fillStyle = '#ffffff'; ctx.fillText(text, x, top + hgt / 2 + 0.5);
      }
      ctx.restore();
    });
  }
}
const utLabels = new SignalLabels();

// Today's levels as lines from 9:30 to the right edge,
// each with its name and price written on it, and the 9:15-9:30 range shaded. Drawn under the candles.
class LevelLines {
  constructor() { this.lines = []; this.boxes = []; const self = this; this.view = { zOrder: () => 'bottom', renderer: () => ({ draw: (t) => self.draw(t) }) }; }
  attached(p) { this.chart = p.chart; this.series = p.series; this.req = p.requestUpdate; }
  detached() { this.chart = null; }
  updateAllViews() {}
  paneViews() { return [this.view]; }
  set(lines, boxes) { this.lines = lines; this.boxes = boxes; if (this.req) this.req(); }
  draw(target) {
    if (!this.chart) return;
    const ts = this.chart.timeScale(), sr = this.series, half = ts.options().barSpacing / 2;
    target.useMediaCoordinateSpace(({ context: ctx, mediaSize }) => {
      const X = (t, edge) => { if (t == null) return mediaSize.width; const x = ts.timeToCoordinate(t); return x === null ? null : x + edge * half; };
      ctx.save();
      for (const b of this.boxes) {
        const x1 = X(b.t1, -1), x2 = X(b.t2, -1), y1 = sr.priceToCoordinate(b.hi), y2 = sr.priceToCoordinate(b.lo);
        if (x1 === null || x2 === null || y1 === null || y2 === null) continue;
        ctx.fillStyle = b.color; ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
      }
      ctx.font = '600 11px "IBM Plex Sans", "Segoe UI", sans-serif'; ctx.textBaseline = 'bottom'; ctx.textAlign = 'left';
      const tags = [];
      for (const l of this.lines) {
        const x1 = X(l.t1, -1), x2 = X(l.t2, 1), y = sr.priceToCoordinate(l.price);
        if (x1 === null || x2 === null || y === null || x2 < 0 || x1 > mediaSize.width) continue;
        ctx.strokeStyle = l.color; ctx.lineWidth = l.width; ctx.setLineDash(l.dash ? [5, 4] : []);
        ctx.beginPath(); ctx.moveTo(x1, Math.round(y) + 0.5); ctx.lineTo(x2, Math.round(y) + 0.5); ctx.stroke();
        if (l.label) tags.push({ l, x: Math.max(x1, 4) + 4, y });
      }
      ctx.setLineDash([]);
      // the names on a solid backing; where lines sit closer than a label is tall (1H, 1D), one name is kept and
      // the rest are left to the price scale, which tags every level
      const kept = [];
      for (const t of tags.sort((a, b) => a.y - b.y)) {
        if (kept.some(k => Math.abs(k.y - t.y) < 16)) continue;
        kept.push(t);
        const w = ctx.measureText(t.l.label).width + 8;
        ctx.fillStyle = this.bg || 'rgba(0,0,0,.6)'; ctx.fillRect(t.x - 4, t.y - 15, w, 14);
        ctx.fillStyle = t.l.color; ctx.fillText(t.l.label, t.x, t.y - 2);
      }
      ctx.restore();
    });
  }
}
const levelLines = new LevelLines();


function chartMsg(text) { const m = document.getElementById('chartMsg'); m.textContent = text || ''; m.classList.toggle('on', !!text); }
function candleWhen(ts, daily) {
  const d = new Date((ts + IST) * 1000);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', timeZone: 'UTC' }) + (daily ? '' : ' ' + clock(d.getUTCHours() * 60 + d.getUTCMinutes()));
}
// a new UT Bot signal on the chart you are looking at: a note on the page, plus sound and notification when alerts are on
function utAlert(p, bar, kind) {
  const key = p.symbol + '|' + p.tf + '|' + state.ut.key + '|' + state.ut.atr + '|' + state.ut.ha, ts = bar ? bar[0] : 0;
  if (!state.utSeen || state.utSeen.key !== key) { state.utSeen = { key, ts }; return; }   // first look: no alert for an old signal
  if (ts <= state.utSeen.ts) return;
  state.utSeen.ts = ts;
  const title = 'UT Bot ' + (kind === 'buy' ? 'Buy' : 'Sell') + ' ' + p.symbol + ' (' + p.tf + ')';
  const body = 'Close ' + inr(bar[4]) + ' at the ' + candleWhen(ts, p.tf === '1d') + ' candle. A chart signal, not advice. Nothing placed.';
  toast('<b>' + esc(title) + '</b><br>' + esc(body), kind);
  if (state.alertsOn) {
    beep();
    try { if (window.Notification && Notification.permission === 'granted') new Notification(title, { body }); } catch (e) {}
  }
}
// Today's levels in the bar above the chart: BUY and SELL, SL, T1-T3 (✓ when hit), and where each side stands
function renderLevelsBar() {
  const bar = document.getElementById('lvbar'), lv = state.levels;
  if (!state.show.levels || !lv) { bar.innerHTML = ''; return; }
  if (lv.status === 'forming') { bar.innerHTML = '<span class="k">Today\'s levels come at 9:30 AM, when the 9:15–9:30 range is in.</span>'; return; }
  if (lv.status === 'refused') { bar.innerHTML = '<span class="k">No levels today: the opening range is under 5 ticks wide.</span>'; return; }
  bar.innerHTML = [lv.buy, lv.sell].map(x => {
    const buy = x.side === 'buy', col = buy ? 'var(--up)' : 'var(--down)';
    let st = x.status === 'trig' ? 'in ' + clock(x.etime) : x.status === 'none' ? 'no entry today' : 'waiting';
    const tv = x.status === 'trig' && (state.data.tf || '5m') === '5m' && state.vals.vol ? state.vals.vol.get(state.data.bars[x.idx][0] + IST) : null;
    if (tv) st += ' · ' + tv.toFixed(1) + '× vol';
    if (x.exit) st += ' · ' + { stop: 'SL hit', t3: 'T3 hit', flat: 'out' }[x.exit.how] + ' ' + clock(x.exit.m);
    return '<span class="side"><button type="button" class="tag" data-desk="' + x.side + '" title="Size it and paper-trade it" style="background:' + col + '">' + (buy ? 'BUY ▸' : 'SELL ▸') + '</button>' +
      '<span class="v" style="color:' + col + '">' + (buy ? '&gt; ' : '&lt; ') + fmt(x.entry) + '</span>' +
      '<span class="k">SL <span class="v">' + fmt(x.stop) + '</span></span>' +
      x.targets.map((t, n) => '<span class="k">T' + (n + 1) + ' <span class="v"' + (x.hits.length > n ? ' style="color:' + col + '"' : '') + '>' + fmt(t) + (x.hits.length > n ? ' ✓' : '') + '</span></span>').join('') +
      '<span class="st">' + st + '</span></span>';
  }).join('');
}
// TradingView-style legend, one line: OHLC and the UT Bot stop at the candle under the mouse (the last candle otherwise)
function showLegend(time) {
  const p = state.data, box = document.getElementById('legend');
  if (!p) { box.innerHTML = ''; return; }
  const cs = p.candles || p.bars;
  let c = time != null ? state.byTime.get(time) : null;
  if (!c && cs.length) c = cs[cs.length - 1];

  });
});
document.addEventListener('click', (e) => { const pop = document.getElementById('utPop'); if (pop.open && !pop.contains(e.target)) pop.open = false; });
document.addEventListener('click', (e) => { const a = document.getElementById('acct'); if (a.open && !a.contains(e.target)) a.open = false; });

// theme: follows the computer until switched here
document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = css('--bg') === '#0f121a', next = dark ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('nse-live-theme', next); } catch (e) {}
  themeChart();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChart);

// the watchlist switch, remembered in this browser
function setRail(on) {
  document.querySelector('.app').classList.toggle('norail', !on);
  const b = document.getElementById('railBtn'); b.setAttribute('aria-pressed', on);
  try { localStorage.setItem('nse-live-rail', on ? '1' : '0'); } catch (e) {}
}
document.getElementById('railBtn').addEventListener('click', () => setRail(document.querySelector('.app').classList.contains('norail')));
{ let r = null; try { r = localStorage.getItem('nse-live-rail'); } catch (e) {} setRail(r !== '0'); }

// ---------------------------------------------------------------- the paper desk: mood, calculator, paper trades, the lock
// The server decides (chart_desk.py here, desk.js on the web): sizes, what may be traded and how trades end.
const desk = { data: null, side: 'buy', target: 1, err: '', open: false };
const rupee = (x) => (x < 0 ? '−' : x > 0 ? '+' : '') + '₹' + Math.abs(x).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
async function postDesk(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('error ' + r.status));
  return j;
}
async function loadDesk() {
  try { desk.data = await getJSON('/api/desk?sym=' + encodeURIComponent(state.sym)); } catch (e) { desk.data = null; }
  renderDesk(); if (state.data) renderChart();
}
function renderMood() {
  const d = desk.data, b = document.getElementById('moodBtn'), pl = document.getElementById('dayPl');
  if (!d) { b.className = 'mood'; document.getElementById('moodTxt').textContent = 'Desk'; pl.hidden = true; return; }
  b.className = 'mood ' + d.mood.level; b.title = d.mood.reasons.join('\n');
  document.getElementById('moodTxt').textContent = d.mood.label;
  const bk = d.book; pl.hidden = !bk.trades.length && !bk.lock;
  pl.textContent = rupee(bk.net) + ' · ' + bk.taken + '/' + bk.max_trades;
  pl.style.color = bk.net > 0 ? 'var(--up)' : bk.net < 0 ? 'var(--down)' : '';
}
function renderDesk() {
  renderMood();
  const d = desk.data, body = document.getElementById('deskBody');
  if (!d) { body.innerHTML = '<p class="why">The desk is not available right now.</p>'; return; }
  const m = d.mood, bk = d.book, s = d.settings, lv = state.levels, side = desk.side, x = lv && lv.status === 'ready' ? lv[side] : null;
  let h = '<h3>Market mood</h3><div class="box moodbox"><b class="mood ' + m.level + '" style="border:0;padding:0;background:none"><i></i> ' + esc(m.label) + '</b>' +
    (m.factor === 0.5 ? ' <span class="why">· sizes are halved</span>' : '') + '<ul>' + m.reasons.map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div>';
  if (bk.lock) h += '<div class="box lockb">🔒 ' + esc(bk.lock) + '</div>';
  // the calculator for the stock on the chart
  h += '<h3>Position · ' + esc(state.sym) + '</h3><div class="box">';
  if (state.data && state.data.is_index) h += '<p class="why">The index cannot be bought or sold in the cash market: pick a stock from the watchlist.</p>';
  else if (!d.sizes || !x) h += '<p class="why">Levels come at 9:30 AM, when the 9:15–9:30 range is in.</p>';
  else {
    const z = d.sizes[side], buy = side === 'buy';
    h += '<div class="sides"><button type="button" class="buy" data-side="buy" aria-pressed="' + buy + '">BUY</button><button type="button" class="sell" data-side="sell" aria-pressed="' + !buy + '">SELL</button></div>';
    const how = x.status === 'trig' ? 'Triggered ' + clock(x.etime) + ': a paper trade enters at the last price.' : x.status === 'none' ? 'No entry today.'
      : 'Armed: fills when a 5-minute candle closes ' + (buy ? 'above ' : 'below ') + fmt(x.entry) + ' (by ' + esc(s.no_entries_after) + ').';
    if (!z.qty) h += '<p class="err">No trade: ' + esc(z.refusal || '0 shares') + '.</p>';
    else {
      h += '<div class="kv"><span>Shares</span><span><b>' + z.qty + '</b></span><span>Entry · stop</span><span>' + fmt(z.entry) + ' · ' + fmt(z.stop) + '</span>' +
        '<span>Money used</span><span>₹' + fmt(z.cost) + '</span><span>Loss at stop (with charges)</span><span style="color:var(--down)">−₹' + fmt(z.loss_at_stop) + '</span>' +
        '<span>Money in other trades</span><span>₹' + fmt(bk.in_use || 0) + '</span><span>Limited by</span><span>' + esc(z.bound_by) + (z.factor === 0.5 ? ' · half size' : '') + '</span></div>';
      h += '<div class="tgt">' + z.targets.map((t, i) => '<button type="button" data-t="' + (i + 1) + '" aria-pressed="' + (desk.target === i + 1) + '">T' + (i + 1) + ' ' + (x.hits && x.hits.length > i ? '✓' : '') +
        '<b style="color:' + (t.net >= 0 ? 'var(--up)' : 'var(--down)') + '">' + rupee(t.net) + '</b></button>').join('') + '</div>';
    }
    const running = bk.trades.some(t => t.symbol === state.sym && ['open', 'waiting'].includes(t.status));
    const blocked = running || bk.lock || !z.qty || x.status === 'none' || ['closed', 'wait', 'sit'].includes(m.level) || (!buy && !s.allow_short);
    const why = running ? 'You already have a paper trade on ' + state.sym + ': exit or cancel it first.' : m.level === 'closed' ? m.reasons[0] : bk.lock ? bk.lock : !buy && !s.allow_short ? 'Short selling is off: turn on "Allow SELL (short)" below.' : ['closed', 'wait', 'sit'].includes(m.level) ? m.reasons[0] : '';
    h += '<button type="button" class="go ' + side + '" id="deskGo"' + (blocked ? ' disabled' : '') + '>Paper ' + (buy ? 'BUY' : 'SELL') + ' ' + (z.qty || '') + ' · T' + desk.target + '</button>' +
      '<p class="why">' + esc(why || how) + ' Out at the stop, T' + desk.target + ' or ' + esc(s.flat_by) + '. Charges counted. Nothing is sent to a broker.</p>' +
      (desk.err ? '<p class="err">' + esc(desk.err) + '</p>' : '');
  }
  h += '</div>';
  // today's paper trades
  h += '<h3>Today · ' + rupee(bk.net) + ' · ' + bk.taken + ' of ' + bk.max_trades + ' trades · loss limit ₹' + fmt(bk.max_daily_loss) + '</h3><div class="box">';
  if (!bk.trades.length) h += '<p class="why">No paper trades today.</p>';
  for (const t of bk.trades.slice().reverse()) {
    const st = t.status === 'open' ? 'open' : t.status === 'waiting' ? 'waiting for the trigger' : t.status === 'cancelled' ? 'cancelled (no trigger)' :
      ({ stop: 'stopped', target: t.target_name + ' hit', flat: 'out at ' + esc(s.flat_by), manual: 'exited' }[t.exit.how] + ' ' + t.exit.time);
    h += '<div class="tr"><span><b style="color:' + (t.side === 'buy' ? 'var(--up)' : 'var(--down)') + '">' + t.side.toUpperCase() + '</b> ' + esc(t.symbol) + ' × ' + t.qty + ' · ' + t.target_name + '</span>' +
      '<span class="pnl" style="color:' + (t.pnl > 0 ? 'var(--up)' : t.pnl < 0 ? 'var(--down)' : 'inherit') + '">' + (t.fill ? rupee(t.pnl) : '–') + '</span>' +
      '<span class="sub">' + (t.fill ? 'in ' + fmt(t.fill.price) + ' ' + t.fill.time + ' · ' : 'placed ' + t.placed + ' · ') + st + (t.fill ? ' · charges ₹' + fmt(t.charges) : '') + '</span>' +
      (t.status === 'open' || t.status === 'waiting' ? '<button type="button" data-exit="' + t.id + '">' + (t.status === 'open' ? 'Exit now' : 'Cancel') + '</button>' : '<span></span>') + '</div>';
  }
  h += '</div>';
  // the settings
  h += '<h3>Your limits</h3><form id="deskSet" class="box">' +
    '<label>Budget (₹) <input type="number" name="budget" min="1" step="1000" value="' + s.budget + '"></label>' +
    '<label>Max loss a trade (₹) <input type="number" name="max_loss_per_trade_inr" min="1" step="50" value="' + s.max_loss_per_trade_inr + '"></label>' +
    '<label>Max loss a day (₹) <input type="number" name="max_daily_loss_inr" min="1" step="100" value="' + s.max_daily_loss_inr + '"></label>' +
    '<label>Trades a day <input type="number" name="max_trades_per_day" min="1" max="50" step="1" value="' + s.max_trades_per_day + '"></label>' +
    '<label>Allow SELL (short, intraday only) <input type="checkbox" name="allow_short"' + (s.allow_short ? ' checked' : '') + '></label>' +
    '<button type="submit">Save</button></form>' +
    '<p class="why">Paper only. Sizes keep the loss at the stop, charges included, within your max loss a trade and what is left of today\'s. The mood is measured on 59 past sessions; it describes, it does not predict.</p>';
  body.innerHTML = h;
}
function openDesk(side) {
  if (side) desk.side = side;
  desk.err = ''; desk.open = true;
  const el = document.getElementById('desk'); el.classList.add('on'); el.setAttribute('aria-hidden', 'false');
  loadDesk();
}
document.getElementById('moodBtn').addEventListener('click', () => openDesk());
document.getElementById('deskClose').addEventListener('click', () => { desk.open = false; const el = document.getElementById('desk'); el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); });
document.getElementById('lvbar').addEventListener('click', (e) => { const b = e.target.closest('[data-desk]'); if (b) openDesk(b.dataset.desk); });
document.getElementById('deskBody').addEventListener('click', async (e) => {
  const sideB = e.target.closest('[data-side]'), tB = e.target.closest('[data-t]'), exitB = e.target.closest('[data-exit]');
  if (sideB) { desk.side = sideB.dataset.side; desk.err = ''; renderDesk(); return; }
  if (tB) { desk.target = +tB.dataset.t; renderDesk(); return; }
  if (e.target.id === 'deskGo') {
    e.target.disabled = true;
    try { desk.data = await postDesk('/api/desk/trade', { sym: state.sym, side: desk.side, target: desk.target }); desk.err = ''; toast('<b>Paper ' + desk.side.toUpperCase() + ' ' + esc(state.sym) + '</b><br>Recorded. Nothing was sent to a broker.'); }
    catch (err) { desk.err = err.message; }
    renderDesk(); renderChart(); return;
  }
  if (exitB) {
    try { desk.data = await postDesk('/api/desk/exit', { id: +exitB.dataset.exit }); } catch (err) { desk.err = err.message; }
    renderDesk(); renderChart();
  }
});
document.getElementById('deskBody').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target, data = { sym: state.sym, allow_short: f.allow_short.checked };
  for (const k of ['budget', 'max_loss_per_trade_inr', 'max_daily_loss_inr', 'max_trades_per_day']) data[k] = +f[k].value;
  try { desk.data = await postDesk('/api/desk/settings', data); desk.err = ''; toast('<b>Limits saved</b>'); } catch (err) { desk.err = err.message; }
  renderDesk();
});

const deskQ = new URLSearchParams(location.search).get('desk');      // read before select() rewrites the address
initChart(); renderList(); select(state.sym); loadStatus(); loadDesk();
if (deskQ) openDesk(deskQ === 'sell' ? 'sell' : 'buy');
setInterval(loadDesk, 30000);
setInterval(loadChart, 30000);
setInterval(loadStatus, 30000);
</script>
